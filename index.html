<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist preoperacional · Llanos</title>
<style>
:root{--bg:#0c1416;--card:#13201f;--line:#28403e;--ink:#eefaf8;--mut:#9bb5b1;--acc:#d4a017}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#1c3b3d,#0a1414 70%) fixed;color:var(--ink)}
header{padding:22px 16px 10px;text-align:center}header small{letter-spacing:.3em;color:#13e0c4;font-weight:800}header h1{margin:4px 0 0;font-size:1.5rem}
main{max-width:760px;margin:0 auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem}input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1514;color:var(--ink);width:100%}
.hd{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.ley{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--mut);margin-top:10px}
ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;counter-reset:q}
li{counter-increment:q;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#0f1a19;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
li.cr{border-left:4px solid var(--acc)}li.no{border-color:#e05252;background:rgba(224,82,82,.08)}li.si{border-color:rgba(19,224,196,.55)}
.t{display:grid;gap:2px}.t::before{content:counter(q)". ";font-weight:800;color:var(--mut);font-size:.75rem}.cat{font-size:.72rem;font-weight:900;letter-spacing:.06em;color:var(--acc)}.t span:last-child{font-weight:600;font-size:.93rem}
.b{display:flex;gap:6px}.b label{position:relative;cursor:pointer}.b input{position:absolute;opacity:0;width:1px;height:1px}
.b span{display:inline-block;min-width:58px;text-align:center;padding:9px 10px;border-radius:10px;border:1px solid var(--line);font-weight:900}
.si input:checked+span{background:linear-gradient(180deg,#1ed9b0,#0e9c86);color:#062c28;border-color:#0e9c86}.no input:checked+span{background:linear-gradient(180deg,#f07070,#c0392b);color:#fff;border-color:#c0392b}
textarea.obs{grid-column:1/-1;min-height:66px}
.obsg{margin-top:12px}.obsg textarea{min-height:90px}
.falta-box{border:1px solid #e05252;background:rgba(224,82,82,.14);color:#ffd2d2;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.9rem}.falta-box ul{margin:6px 0 0 18px;padding:0}.falta-box li{display:list-item;border:0;background:none;padding:1px 0}
.falta{outline:2px solid #e05252!important;outline-offset:2px}li.falta{background:rgba(224,82,82,.1)}
.acep{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px dashed var(--line);border-radius:12px;margin-top:12px;font-weight:400}.acep input{width:auto;margin-top:4px}
button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:14px;width:100%;margin-top:14px;cursor:pointer;background:linear-gradient(180deg,#f2c94c,#d4a017 55%,#b8860b);color:#111;box-shadow:0 6px 14px rgba(0,0,0,.35)}
button:disabled{opacity:.7}#msg{margin-top:8px;color:#f2c94c;font-weight:700;min-height:1.2em}
@media (max-width:560px){li{grid-template-columns:1fr}.b span{min-width:72px}}
</style></head><body>
<header><small>LLANOS</small><h1>Checklist preoperacional</h1></header>
<main><form id="f" novalidate>
<div class="card"><div class="hd">
 <label>Sede *<select id="sede" required><option value="">Elige…</option><option>Villavicencio</option><option>Yopal</option></select></label>
 <label>Placa *<input id="placa" required maxlength="8" placeholder="Ej: TRK494" list="plas" autocomplete="off" style="text-transform:uppercase"><datalist id="plas"></datalist></label>
 <label>Conductor *<input id="nom" required maxlength="80" placeholder="Nombre completo" autocomplete="name"></label>
 <label>Operación *<select id="oper" required><option value="">Elige…</option><option>Salida</option><option>Retorno</option></select></label>
 <label>Kilometraje<input id="km" type="number" min="0" inputmode="numeric" placeholder="Opcional"></label></div>
 <div class="ley"><span>⚠ = ítem crítico</span><span>Si respondes <b>NO</b>, escribe la observación.</span></div></div>
<div class="card"><ol id="lst"></ol>
<label class="obsg">Observaciones<textarea id="obsg" maxlength="1500" placeholder="Escribe aquí cualquier observación adicional (opcional)"></textarea></label>
<div class="falta-box" id="falta" role="alert" hidden></div>
<label class="acep"><input type="checkbox" id="acep"><span><b>ACEPTACIÓN Y DECLARACIÓN DE VERACIDAD DE CHECKLIST *</b><br><small>Declaro que la información registrada es verdadera y corresponde al estado real del vehículo.</small></span></label>
<button type="submit" id="send">Enviar</button><div id="msg" role="status"></div></div>
</form></main>
<script type="module">
// ===== Base de datos: proyecto Firebase «checklist-583f9» (colección «checklists») =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDYsewqqh0a0m46vRRN_bP3F6NBYGldyTE",authDomain:"checklist-583f9.firebaseapp.com",projectId:"checklist-583f9",storageBucket:"checklist-583f9.firebasestorage.app",messagingSenderId:"906852823631",appId:"1:906852823631:web:0727d6d9405f2d5be3703a",measurementId:"G-CCPMV617JB"};
const db=getFirestore(initializeApp(firebaseConfig));
// Si quieres que cada envío llegue al Excel de Drive, pega aquí la URL de la aplicación web de Apps Script (termina en /exec)
const URL_EXCEL='';
const Q=[['DOC','¿Cuenta con documentación vigente, física o digital?',1],['SEG','¿El cinturón de seguridad se encuentra operativo?',1],['SEG','¿La alarma de reversa funciona correctamente?',1],
 ['SEG','¿La caja fuerte se encuentra disponible y en buen estado?',1],['SEG','¿El botón de pánico se encuentra disponible en el vehículo?',1],['MEC','¿Los frenos de servicio operan correctamente?',1],
 ['MEC','¿El freno de mano opera correctamente?',1],['MEC','¿La dirección se encuentra sin anomalías?',1],['MEC','¿El tablero y los indicadores funcionan correctamente?',0],
 ['LUZ','¿Las luces de freno funcionan correctamente?',1],['LUZ','¿El sistema de iluminación funciona correctamente?',0],['VIS','¿Los espejos se encuentran en buen estado?',1],
 ['VIS','¿Los limpiaparabrisas funcionan correctamente?',0],['VIS','¿El parabrisas se encuentra libre de daños críticos?',0],
 ['EQU','¿El vehículo cuenta con botiquín y se ha validado con Seguridad que se encuentre completo y con artículos vigentes?',0],
 ['TEC','¿El vehículo cuenta con cámara de reversa y funciona correctamente en la posición adecuada?',0],['TEC','¿El vehículo cuenta con Dashcam y funciona correctamente?',0],
 ['ORD','¿La unidad se encuentra limpia y ordenada?',0],['SEG','¿El claxon funciona correctamente?',0],['MEC','¿El vehículo se encuentra sin fugas de líquidos debajo del camión?',1],
 ['MEC','¿El vehículo se encuentra sin fugas de aire?',1],['SEG','¿Extintor vigente y disponible?',1],['LLA','¿Presión correcta en todas las llantas?',1],
 ['LLA','¿Llantas con dibujo/milimetraje aceptable?',1],['LLA','¿Llantas en buen estado sin daños o golpes visibles?',1],['LLA','¿Pernos o tuercas de Llanta completas y en buen estado?',1],
 ['CAR','¿La Carrocería se encuentra en buen estado y funcional?',0],['EQU','¿Conos/reflejantes completos?',1],['EQU','¿Tacos o bloqueadores de rueda disponibles?',1],
 ['ETI','¿Cuenta con todas las etiquetas de seguridad y señalización completas y visibles?',0],['CARRET','¿Carretillas o diablos se encuentran completos?',0],['CARRET','¿Carretillas o diablos se encuentran funcionales?',0]];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
$('lst').innerHTML=Q.map(([c,q,cr],i)=>`<li class="${cr?'cr':''}" data-q="${i}"><div class="t"><span class="cat">${cr?'⚠ ':''}${c}</span><span>${esc(q)} *</span></div>
 <div class="b"><label class="si"><input type="radio" name="q${i}" value="SI"><span>SI</span></label><label class="no"><input type="radio" name="q${i}" value="NO"><span>NO</span></label></div>
 <textarea class="obs" id="o${i}" hidden maxlength="500" placeholder="Observaciones (obligatorio si es NO)"></textarea></li>`).join('');
// placas de la sede (config/placas_Villavicencio, config/placas_Yopal) como sugerencias
// placas de la sede (las registradas en Reportes): si hay lista, la placa se elige de un desplegable
const plIn=$('placa').outerHTML;
$('sede').addEventListener('change',async()=>{const s=$('sede').value;let l=[];if(s){try{const d=await getDoc(doc(db,'config','placas_'+s));l=d.exists()?(d.data().placas||[]):[]}catch(x){}}
  const cur=$('placa');if(l.length){const sel=document.createElement('select');sel.id='placa';sel.required=true;sel.innerHTML='<option value="">Elige la placa…</option>'+l.map(p=>`<option>${esc(p)}</option>`).join('');cur.replaceWith(sel)}
  else if(cur.tagName==='SELECT'){const w=document.createElement('div');w.innerHTML=plIn;cur.replaceWith(w.firstChild)}});
let urlExcel=URL_EXCEL;getDoc(doc(db,'config','excel')).then(d=>{if(d.exists()&&d.data().url)urlExcel=d.data().url}).catch(()=>{});
$('f').addEventListener('change',e=>{const r=e.target;if(r.type!=='radio')return;const i=r.name.slice(1),o=$('o'+i),li=r.closest('li');o.hidden=r.value!=='NO';li.classList.toggle('no',r.value==='NO');li.classList.toggle('si',r.value==='SI');if(r.value==='NO')o.focus()});
$('f').onsubmit=async e=>{e.preventDefault();const m=$('msg'),b=$('send'),sede=$('sede').value,pl=$('placa').value.trim().toUpperCase(),nm=$('nom').value.trim();
 document.querySelectorAll('.falta').forEach(x=>x.classList.remove('falta'));const fal=[],res=[],fz=$('falta');
 if(!sede){fal.push('Sede');$('sede').classList.add('falta')}if(!pl){fal.push('Placa');$('placa').classList.add('falta')}if(!nm){fal.push('Nombre del conductor');$('nom').classList.add('falta')}const oper=$('oper').value;if(!oper){fal.push('Operación (Salida o Retorno)');$('oper').classList.add('falta')}
 const sinR=[],sinO=[];for(let i=0;i<Q.length;i++){const v=(document.querySelector(`input[name=q${i}]:checked`)||{}).value,o=$('o'+i).value.trim();
  if(!v){sinR.push(i+1);document.querySelector(`[data-q="${i}"]`).classList.add('falta')}else if(v==='NO'&&!o){sinO.push(i+1);document.querySelector(`[data-q="${i}"]`).classList.add('falta')}res.push({v,o})}
 if(sinR.length)fal.push('Preguntas sin responder: '+sinR.join(', '));if(sinO.length)fal.push('Falta la observación de las preguntas en NO: '+sinO.join(', '));
 if(!$('acep').checked){fal.push('Aceptación y declaración de veracidad');$('acep').closest('.acep').classList.add('falta')}
 if(fal.length){fz.hidden=false;fz.innerHTML='<b>⚠ No se puede enviar todavía. Falta completar:</b><ul>'+fal.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';m.textContent='';(document.querySelector('.falta')||fz).scrollIntoView({behavior:'smooth',block:'center'});return}
 fz.hidden=true;
 const d=new Date(),p=n=>String(n).padStart(2,'0'),no=res.filter(r=>r.v==='NO').length;
 const data={fecha:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,sede,placa:pl,conductor:nm,operacion:oper,km:$('km').value||'',si:res.length-no,no,
  criticosNo:Q.filter((q,i)=>q[2]&&res[i].v==='NO').map(q=>q[0]+' - '+q[1]).join(' | '),preguntas:Q.map(q=>(q[2]?'⚠ ':'')+q[0]+' - '+q[1]),respuestas:res.map(r=>r.v),observaciones:res.map(r=>r.o),aceptacion:'SI',obsGeneral:$('obsg').value.trim()};
 b.disabled=true;b.textContent='Enviando…';
 try{const respuestas={};res.forEach((r,i)=>respuestas['q'+String(i+1).padStart(2,'0')]={r:r.v,obs:r.o});
  await addDoc(collection(db,'checklists'),{fecha:data.fecha,creado:serverTimestamp(),sede,placa:pl,conductor:nm,operacion:oper,km:data.km,totalSi:data.si,totalNo:no,
    criticosNo:Q.filter((q,i)=>q[2]&&res[i].v==='NO').map(q=>q[0]+' - '+q[1]),respuestas,obsGeneral:data.obsGeneral,aceptacion:true,origen:'enlace'});
  if(urlExcel)fetch(urlExcel,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).catch(()=>{});
  document.querySelector('main').innerHTML=`<div class="card"><h2 style="margin:0">✔ Checklist enviado</h2><p>Placa <b>${esc(pl)}</b> · ${esc(nm)} · ${esc(sede)} · <b>${esc(oper)}</b><br>${data.fecha} · ${no} ítem${no===1?'':'s'} en NO</p>
   ${data.obsGeneral?`<p><b>Observaciones:</b> ${esc(data.obsGeneral)}</p>`:''}${no?`<ul>${res.map((r,i)=>r.v==='NO'?`<li style="display:list-item;border:0;padding:2px 0;background:none">${esc(Q[i][0]+' - '+Q[i][1])}: <i>${esc(r.o)}</i></li>`:'').join('')}</ul>`:''}<button onclick="location.reload()">Llenar otro checklist</button></div>`}
 catch(x){console.error(x);m.textContent='No se pudo guardar el checklist'+(x&&x.code==='permission-denied'?' (revisa las reglas de Firestore)':x&&x.code==='unavailable'?' (sin conexión)':'')+'. Intenta de nuevo.';b.disabled=false;b.textContent='Enviar'}};
</script></body></html>
