<div class=\"toolbar\">\n      <div><label>Sede<\/label><select id=\"qSede\"><option value=\"\">Todas<\/option><\/select><\/div>\n      <div><label>Placa<\/label><select id=\"qPlaca\"><option value=\"\">Todas<\/option><\/select><\/div>\n      <div><label>Estado<\/label><select id=\"qEst\"><option value=\"\">Todos<\/option><option>DISPONIBLE<\/option><option>NO DISPONIBLE<\/option><\/select><\/div>\n      <div><label>Ver<\/label><select id=\"qVer\"><option value=\"todos\">Todos los registros<\/option><option value=\"abiertos\">Solo en taller (abiertos)<\/option><option value=\"ultimo\">Último estado por placa<\/option><\/select><\/div>\n      <div><label>Desde<\/label><input type=\"date\" id=\"qDesde\"><\/div>\n      <div><label>Hasta<\/label><input type=\"date\" id=\"qHasta\"><\/div>\n      <div style=\"min-width:auto\"><label>Excel del día<\/label><div style=\"display:flex;gap:8px\"><input type=\"date\" id=\"dDia\" style=\"width:150px\"><select id=\"dSede\" style=\"width:160px\"><\/select><button class=\"btn\" id=\"diaBtn\" type=\"button\" title=\"Placas por CD disponibles y no disponibles ese día\">⬇ Excel del día<\/button><\/div><\/div>\n      <div style=\"min-width:auto;display:flex;gap:8px\"><button class=\"btn-ok\" id=\"xlsBtn\" type=\"button\" title=\"Todo el histórico, incluidas las placas ya habilitadas\">⬇ Histórico Excel<\/button><button class=\"btn-ghost\" id=\"csvBtn\" type=\"button\" title=\"Todo el histórico, incluidas las placas ya habilitadas\">⬇ CSV<\/button><\/div>\n    <\/div>\n    <div class=\"tablewrap\">\n      <table>\n        <thead><tr>\n          <th>Fecha<\/th><th>CD<\/th><th>Placa<\/th><th>Estado<\/th><th>Motivo<\/th><th>Sistema<\/th>\n          <th>Novedad<\/th><th>Ingreso taller<\/th><th>Salida taller<\/th><th>Días en taller<\/th><th>Taller<\/th><th><\/th>\n        <\/tr><\/thead>\n        <tbody id=\"tb\"><\/tbody>\n      <\/table>\n    <\/div>\n    <div class=\"msg\" id=\"tblMsg\" style=\"margin-top:8px\"><\/div>\n  <\/section>\n<\/main>\n\n<div class=\"modal hide\" id=\"modal\"><div class=\"box\"><p id=\"modalTxt\"><\/p>\n  <div class=\"actions\" style=\"margin-top:0\"><button class=\"btn\" id=\"mOk\">Confirmar<\/button><button class=\"btn-ghost\" id=\"mCancel\">Cancelar<\/button><\/div><\/div><\/div>\n\n<script>\n(function(){var P=parent;window.claude={use:async function(k){\n if(k==='db')return P.__dispDB;\n if(k==='downloads')return{save:async function(o){var b=new Blob([o.data],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}};\n return null}};})();\n<\/script>\n<script>\nconst SISTEMAS = [\"Audible\",\"Cámaras\",\"Carpas/Cortinas\",\"Carretillas\",\"Carrocería botellera\",\"Dirección\",\"Documentos\",\"Eléctrico\",\"Espejos y vidrios\",\"Frenos\",\"Fuga de aceite\",\"Fuga de aire\",\"Golpes y rayones\",\"Kit carretera\",\"Kit seguridad\",\"Llantas\",\"Luces\",\"Motor\",\"Otra\",\"Preventivos\",\"Puertas\",\"Refrigeración\",\"Sillas\",\"Suspensión\",\"Combustible\",\"Seguridad\",\"Conos / Carretillas\",\"Embrague\",\"Cinturones\",\"OTRO\"];\nconst SEDES = [\"VILLAVICENCIO\",\"YOPAL\"];\nconst TXT_TG={cFlota:[\"＋ Registrar placas\",\"▲ Minimizar\"],cForm:[\"＋ Reportar novedad\",\"▲ Minimizar\"]};\nfunction plegar(id,abrir){const c=document.getElementById(id);if(abrir===undefined)abrir=!c.classList.contains(\"abierta\");c.classList.toggle(\"abierta\",abrir);\n  const b=c.querySelector(\"[data-tg]\");b.textContent=TXT_TG[id][abrir?1:0];b.setAttribute(\"aria-expanded\",abrir);\n  if(abrir)setTimeout(()=>c.scrollIntoView({behavior:\"smooth\",block:\"start\"}),30);}\ndocument.addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-tg]\");if(b)plegar(b.dataset.tg);});\nconst $ = id => document.getElementById(id);\nconst sedeOpts = SEDES.map(s=>`<option>${s}<\/option>`).join(\"\");\n$(\"cd\").innerHTML = '<option value=\"\">Seleccione…<\/option>' + sedeOpts;\n$(\"pSede\").innerHTML = sedeOpts;\n$(\"qSede\").innerHTML = '<option value=\"\">Todas<\/option>' + sedeOpts;\n$(\"kSede\").innerHTML = '<option value=\"\">TODAS LAS SEDES<\/option>' + sedeOpts;\nlet placas = []; // {id, placa, sede}\nfunction placasDe(sede){return placas.filter(p=>!sede||p.sede===sede).map(p=>p.placa).sort();}\nfunction fillPlacaSelect(sel, sede, current, allLabel){\n  const list = placasDe(sede);\n  if(current && !list.includes(current)) list.unshift(current);\n  const first = allLabel ? `<option value=\"\">${allLabel}<\/option>` : `<option value=\"\">${sede?(list.length?\"Seleccione…\":\"Sin placas en esta sede\"):\"Seleccione primero el CD…\"}<\/option>`;\n  sel.innerHTML = first + list.map(p=>`<option>${esc(p)}<\/option>`).join(\"\");\n  sel.value = current || \"\";\n}\nfunction refreshPlacaSelects(){\n  fillPlacaSelect($(\"placa\"), $(\"cd\").value, $(\"placa\").value);\n  fillPlacaSelect($(\"qPlaca\"), $(\"qSede\").value, $(\"qPlaca\").value, \"Todas\");\n}\nconst sis = $(\"sistema\");\nsis.innerHTML = '<option value=\"\">Seleccione…<\/option>' + SISTEMAS.map(s=>`<option>${s}<\/option>`).join(\"\");\n\nfunction todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}\nfunction fmt(iso){if(!iso)return\"\";const[y,m,d]=iso.split(\"-\");return`${d}/${m}/${y}`;}\nfunction daysBetween(a,b){if(!a||!b)return null;const t=(Date.parse(b+\"T00:00:00Z\")-Date.parse(a+\"T00:00:00Z\"))/86400000;return Math.max(0,Math.round(t));}\nfunction esc(s){return String(s??\"\").replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));}\n\nconst HOY = todayISO();\nconst MANANA = (()=>{const d=new Date(HOY+\"T12:00:00\");d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);})();\nconst SEIS_H = 6*3600*1000; // registros con más de 6 horas nunca se eliminan del histórico\nconst fmtFH=ms=>{if(!ms)return\"\";const d=new Date(ms),p=n=>String(n).padStart(2,\"0\");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;};\n$(\"hoyLbl\").textContent = \"Hoy: \" + fmt(HOY);\n$(\"fecha\").value = HOY;\n$(\"ingreso\").min = HOY; $(\"ingreso\").max = MANANA;\n$(\"dDia\").value = HOY; $(\"dDia\").max = HOY;\n$(\"dSede\").innerHTML = sedeOpts;\n\nconst MAYUS=new Set();\nlet todos=[], db=null, col=null, rows=[], editingId=null, canWrite=true;\n\n/* ---------- Form behaviour ---------- */\nfunction syncForm(){\n  const nd = $(\"estado\").value === \"NO DISPONIBLE\";\n  document.querySelectorAll(\".nd\").forEach(el=>el.classList.toggle(\"hide\",!nd));\n  $(\"tallerOtroWrap\").classList.toggle(\"hide\", !(nd && $(\"taller\").value===\"OTRO\"));\n  if($(\"estado\").value===\"DISPONIBLE\" && !$(\"motivo\").value) $(\"motivo\").value=\"OPERATIVO\";\n  if(nd && $(\"motivo\").value===\"OPERATIVO\") $(\"motivo\").value=\"\";\n  const ing=$(\"ingreso\").value;\n  $(\"diasPreview\").value = ing ? daysBetween(ing,HOY)+\" día(s) a hoy\" : \"\";\n}\n[\"estado\",\"taller\",\"ingreso\"].forEach(id=>$(id).addEventListener(\"change\",syncForm));\n$(\"novedad\").addEventListener(\"input\",e=>{const a=e.target.selectionStart,b=e.target.selectionEnd;e.target.value=e.target.value.toUpperCase();e.target.setSelectionRange(a,b);});\n$(\"pPlaca\").addEventListener(\"input\",e=>{const p=e.target.selectionStart;e.target.value=e.target.value.toUpperCase();e.target.setSelectionRange(p,p);});\n$(\"cd\").addEventListener(\"change\",()=>fillPlacaSelect($(\"placa\"),$(\"cd\").value,\"\"));\n$(\"qSede\").addEventListener(\"change\",()=>fillPlacaSelect($(\"qPlaca\"),$(\"qSede\").value,\"\",\"Todas\"));\n$(\"kSede\").addEventListener(\"change\",aplicarSede);\nfunction sedesVis(){const k=$(\"kSede\").value;return k?[k]:SEDES;}\nfunction aplicarSede(){const k=$(\"kSede\").value;if(k)$(\"dSede\").value=k;\n  $(\"qSede\").value=k;$(\"qSede\").disabled=!!k;fillPlacaSelect($(\"qPlaca\"),k,\"\",\"Todas\");\n  if(k){$(\"pSede\").value=k;if(!editingId&&$(\"cd\").value!==k){$(\"cd\").value=k;fillPlacaSelect($(\"placa\"),k,\"\");}}\n  [$(\"pSede\"),$(\"cd\")].forEach(s=>[...s.options].forEach(o=>{o.hidden=!!k&&!!o.value&&o.value!==k;}));\n  render();}\nsyncForm();\n\nfunction resetForm(){\n  $(\"f\").reset(); $(\"fecha\").value=HOY; editingId=null; $(\"ingreso\").min=HOY;\n  fillPlacaSelect($(\"placa\"),\"\",\"\");\n  $(\"formTitle\").textContent=\"Nuevo registro\"; $(\"saveBtn\").textContent=\"Guardar registro\";\n  syncForm();\n}\n$(\"resetBtn\").onclick=()=>{resetForm();setMsg(\"\");if($(\"kSede\").value){$(\"cd\").value=$(\"kSede\").value;fillPlacaSelect($(\"placa\"),$(\"cd\").value,\"\");}};\n\nfunction setMsg(t,cls){$(\"msg\").textContent=t;$(\"msg\").className=\"msg \"+(cls||\"\");}\n\nfunction openRecordFor(placa, excludeId){\n  return rows.filter(r=>r.placa===placa && r.estado===\"NO DISPONIBLE\" && !r.fechaSalida && r.id!==excludeId)\n             .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];\n}\n\n$(\"f\").addEventListener(\"submit\", async e=>{\n  e.preventDefault();\n  if(!col){setMsg(\"No hay conexión con la base de datos; no se pudo guardar.\",\"err\");return;}\n  const v = id=>$(id).value.trim();\n  const rec = {\n    fecha: v(\"fecha\")||HOY, cd:v(\"cd\").toUpperCase(), placa:v(\"placa\").toUpperCase().replace(/\\s+/g,\"\"),\n    estado:v(\"estado\"), motivo:v(\"motivo\"), novedad:v(\"novedad\").toUpperCase()\n  };\n  if(!rec.cd||!rec.placa||!rec.estado||!rec.motivo){setMsg(\"Complete CD, Placa, Estado y Motivo.\",\"err\");return;}\n  if(rec.estado===\"NO DISPONIBLE\"){\n    rec.sistema=v(\"sistema\").toUpperCase(); rec.fechaIngreso=v(\"ingreso\"); rec.taller=v(\"taller\");\n    if(rec.taller===\"OTRO\" && v(\"tallerOtro\")) rec.taller=\"OTRO - \"+v(\"tallerOtro\").toUpperCase();\n    if(!rec.sistema||!rec.fechaIngreso||!rec.taller){setMsg(\"Para NO DISPONIBLE complete Sistema, Fecha de ingreso y Taller.\",\"err\");return;}\n    const origI=editingId?((rows.find(r=>r.id===editingId)||{}).fechaIngreso||\"\"):\"\";\n    if(rec.fechaIngreso!==origI&&(rec.fechaIngreso<HOY||rec.fechaIngreso>MANANA)){setMsg(`La fecha de ingreso a taller solo puede ser hoy (${fmt(HOY)}) o mañana (${fmt(MANANA)}); no se permiten días pasados.`,\"err\");return;}\n  } else { rec.sistema=\"\"; rec.fechaIngreso=\"\"; rec.taller=\"\"; }\n\n  $(\"saveBtn\").disabled=true;\n  try{\n    if(editingId){\n      const old = rows.find(r=>r.id===editingId)||{};\n      const keep = {createdAt:old.createdAt||Date.now(), fechaSalida:old.fechaSalida||\"\", diasTaller:old.diasTaller??null, cerradoPor:old.cerradoPor||\"\"};\n      if(keep.fechaSalida && rec.fechaIngreso) keep.diasTaller = daysBetween(rec.fechaIngreso, keep.fechaSalida);\n      await col.doc(editingId).set({...rec,...keep});\n      setMsg(\"Registro actualizado.\",\"ok\");\n    } else {\n      const now=Date.now();\n      let cerro=\"\";\n      if(rec.estado===\"DISPONIBLE\"){\n        const open = openRecordFor(rec.placa);\n        if(open){\n          const dias = daysBetween(open.fechaIngreso||open.fecha, rec.fecha);\n          const {id,...body}=open;\n          await col.doc(open.id).set({...body, fechaSalida:rec.fecha, diasTaller:dias});\n          rec.fechaIngreso=open.fechaIngreso||open.fecha; rec.fechaSalida=rec.fecha; rec.diasTaller=dias;\n          rec.taller=open.taller; rec.sistema=open.sistema;\n          cerro=` Se cerró la novedad abierta: ${dias} día(s) en taller.`;\n        }\n      } else if(openRecordFor(rec.placa)){\n        setMsg(`La placa ${rec.placa} ya tiene un registro NO DISPONIBLE abierto. Regístrela como DISPONIBLE o edite el existente.`,\"err\");\n        $(\"saveBtn\").disabled=false; return;\n      }\n      await col.doc().set({...rec, createdAt:now, fechaSalida:rec.fechaSalida||\"\", diasTaller:rec.diasTaller??null});\n      setMsg(\"Registro guardado.\"+cerro,\"ok\");\n    }\n    resetForm();\n  }catch(err){\n    setMsg(err&&err.code===\"invalid_argument\"?\"No tiene permiso para guardar en este formulario.\":\"Error al guardar: \"+(err&&err.message||err),\"err\");\n  }finally{$(\"saveBtn\").disabled=false;}\n});\n\n/* ---------- Table ---------- */\n[\"qSede\",\"qPlaca\",\"qEst\",\"qVer\",\"qDesde\",\"qHasta\"].forEach(id=>$(id).addEventListener(\"change\",render));\n\nfunction filtered(){\n  let list=[...rows].sort((a,b)=>(b.fecha||\"\").localeCompare(a.fecha||\"\")||(b.createdAt||0)-(a.createdAt||0));\n  const ver=$(\"qVer\").value;\n  if(ver===\"ultimo\"){const seen=new Set();list=list.filter(r=>!seen.has(r.placa)&&seen.add(r.placa));}\n  if(ver===\"abiertos\") list=list.filter(r=>r.estado===\"NO DISPONIBLE\"&&!r.fechaSalida);\n  const sd=$(\"qSede\").value, pl=$(\"qPlaca\").value, est=$(\"qEst\").value, d1=$(\"qDesde\").value, d2=$(\"qHasta\").value;\n  return list.filter(r=>(!sd||r.cd===sd)&&(!pl||r.placa===pl)&&(!est||r.estado===est)&&(!d1||r.fecha>=d1)&&(!d2||r.fecha<=d2));\n}\n// Histórico: todos los registros (abiertos, cerrados y habilitados), sin importar «Ver» ni «Estado»; respeta sede, placa y fechas\nfunction historico(){const sd=$(\"qSede\").value, pl=$(\"qPlaca\").value, d1=$(\"qDesde\").value, d2=$(\"qHasta\").value;\n  return [...todos].sort((a,b)=>(a.fecha||\"\").localeCompare(b.fecha||\"\")||(a.createdAt||0)-(b.createdAt||0))\n    .filter(r=>(!sd||r.cd===sd)&&(!pl||r.placa===pl)&&(!d1||r.fecha>=d1)&&(!d2||r.fecha<=d2));}\nfunction diasOf(r){\n  if(r.diasTaller!=null) return {n:r.diasTaller,open:false};\n  if(r.estado===\"NO DISPONIBLE\"&&!r.fechaSalida) return {n:daysBetween(r.fechaIngreso||r.fecha,HOY),open:true};\n  return null;\n}\nfunction render(){\n  // KPIs from latest status per plate\n  const latest={};\n  [...rows].sort((a,b)=>(a.fecha||\"\").localeCompare(b.fecha||\"\")||(a.createdAt||0)-(b.createdAt||0)).forEach(r=>latest[r.placa]=r);\n  const stats = sede=>{\n    const fl=placasDe(sede), no=fl.filter(p=>latest[p]&&latest[p].estado===\"NO DISPONIBLE\").length;\n    return {total:fl.length,no,disp:fl.length-no,pct:fl.length?Math.round((fl.length-no)/fl.length*1000)/10+\"%\":\"–\"};\n  };\n  const k=stats($(\"kSede\").value);\n  $(\"kTotal\").textContent=k.total; $(\"kDisp\").textContent=k.disp; $(\"kNo\").textContent=k.no; $(\"kPct\").textContent=k.pct;\n  $(\"sedeKpis\").innerHTML=sedesVis().map(s=>{const t=stats(s);return `<div class=\"kpi\"><div class=\"l\">${s}<\/div><div class=\"v\">${t.pct}<\/div><div class=\"muted\" style=\"font-size:12px;margin-top:2px\">${t.disp} disponibles de ${t.total} · ${t.no} no disponibles<\/div><\/div>`;}).join(\"\");\n  renderSedes(latest);\n\n  const list=filtered();\n  if(!list.length){$(\"tb\").innerHTML=`<tr><td colspan=\"12\" class=\"empty\">${rows.length?\"Sin resultados para el filtro.\":\"Aún no hay registros. Diligencie el formulario para empezar.\"}<\/td><\/tr>`;return;}\n  $(\"tb\").innerHTML=list.map(r=>{\n    const d=diasOf(r);\n    const isOpen=r.estado===\"NO DISPONIBLE\"&&!r.fechaSalida;\n    const est=r.estado===\"DISPONIBLE\"?'<span class=\"pill p-ok\">DISPONIBLE<\/span>':`<span class=\"pill p-bad\">NO DISPONIBLE<\/span>`;\n    const mot=r.motivo===\"OPERATIVO\"?`<span class=\"pill p-ok\">${esc(r.motivo)}<\/span>`:`<span class=\"pill p-bad\">${esc(r.motivo)}<\/span>`;\n    const dd=d?`<span class=\"days\">${d.n}<\/span>${d.open?' <span class=\"pill p-warn\">en curso<\/span>':''}`:\"\";\n    const acts=canWrite?`${isOpen?`<button class=\"btn-ok btn-sm\" data-hab=\"${r.id}\">Habilitar<\/button> `:\"\"}<button class=\"btn-ghost btn-sm\" data-ed=\"${r.id}\">Editar<\/button> <button class=\"btn-del btn-sm\" data-del=\"${r.id}\">Borrar<\/button>`:\"\";\n    return `<tr><td>${fmt(r.fecha)}<\/td><td>${esc(r.cd)}<\/td><td class=\"placa\">${esc(r.placa)}<\/td><td>${est}<\/td><td>${mot}<\/td>\n      <td>${esc(r.sistema)}<\/td><td>${esc(String(r.novedad||\"\").toUpperCase())}<\/td><td>${fmt(r.fechaIngreso)}<\/td><td>${fmt(r.fechaSalida)}<\/td><td>${dd}<\/td><td>${esc(r.taller)}<\/td><td style=\"white-space:nowrap\">${acts}<\/td><\/tr>`;\n  }).join(\"\");\n}\n\n/* ---------- Placas por sede ---------- */\nlet verPl=false;\nfunction lblPl(){const n=placas.filter(p=>sedesVis().includes(p.sede)).length;$(\"pVer\").textContent=verPl?\"▲ Ocultar placas\":`▼ Mostrar placas (${n})`;$(\"pVer\").setAttribute(\"aria-expanded\",verPl);$(\"sedesList\").classList.toggle(\"hide\",!verPl);}\n$(\"pVer\").onclick=()=>{verPl=!verPl;lblPl();};\nfunction renderSedes(latest){\n  lblPl();\n  $(\"sedesList\").innerHTML=sedesVis().map(s=>{\n    const list=placas.filter(p=>p.sede===s).sort((a,b)=>a.placa.localeCompare(b.placa));\n    const chips=list.map(p=>{const nd=latest[p.placa]&&latest[p.placa].estado===\"NO DISPONIBLE\";\n      return `<span class=\"chip${nd?\" nd\":\"\"}\" title=\"${nd?\"No disponible\":\"Disponible\"}\">${esc(p.placa)}${canWrite?`<button type=\"button\" data-delp=\"${esc(p.id)}\" aria-label=\"Eliminar ${esc(p.placa)}\">×<\/button>`:\"\"}<\/span>`;}).join(\"\");\n    return `<div class=\"sede\"><h3><span>${s}<\/span><span class=\"muted\">${list.length} placa(s)<\/span><\/h3><div class=\"chips\">${chips||'<span class=\"muted\">Sin placas registradas.<\/span>'}<\/div><\/div>`;\n  }).join(\"\");\n}\nfunction pMsg(t,c){$(\"pMsg\").textContent=t;$(\"pMsg\").className=\"msg \"+(c||\"\");}\nasync function addPlaca(){\n  if(!db){pMsg(\"Sin conexión con la base de datos.\",\"err\");return;}\n  const sede=$(\"pSede\").value;\n  const lista=[...new Set($(\"pPlaca\").value.toUpperCase().split(/[\\s,;]+/).map(x=>x.replace(/[^A-Z0-9]/g,\"\")).filter(Boolean))];\n  if(!lista.length){pMsg(\"Escriba una o varias placas.\",\"err\");return;}\n  if(lista.length>200){pMsg(`Máximo 200 placas por vez (escribió ${lista.length}).`,\"err\");return;}\n  const largas=lista.filter(p=>p.length>10), ya=[], nuevas=[];\n  lista.filter(p=>p.length<=10).forEach(p=>{const ex=placas.find(x=>x.placa===p);if(ex)ya.push(`${p} (${ex.sede})`);else nuevas.push(p);});\n  const extra=(ya.length?` Ya registradas: ${ya.join(\", \")}.`:\"\")+(largas.length?` No válidas: ${largas.join(\", \")}.`:\"\");\n  if(!nuevas.length){pMsg(\"Ninguna placa nueva.\"+extra,\"err\");return;}\n  $(\"pAdd\").disabled=true;\n  try{\n    const now=Date.now();\n    await Promise.all(nuevas.map(placa=>db.collection(\"placas\").doc(placa).set({placa,sede,createdAt:now})));\n    $(\"pPlaca\").value=\"\";\n    pMsg(`${nuevas.length} placa(s) agregada(s) a ${sede}.`+extra,\"ok\");\n    $(\"pPlaca\").focus();\n  }catch(err){const c=String(err&&err.code||\"\"),m=String(err&&err.message||err||\"\");\n    pMsg(c===\"invalid_argument\"||/permission|insufficient/i.test(c+m)?\"Firebase no dio permiso: publica las reglas nuevas (disp_registros y disp_placas) en Firestore → Reglas.\":`No se pudieron guardar las placas (${c||\"sin código\"}: ${m.slice(0,140)}).`,\"err\");console.error(err);}\n  finally{$(\"pAdd\").disabled=false;}\n}\n$(\"pAdd\").onclick=addPlaca;\n$(\"pPlaca\").addEventListener(\"keydown\",e=>{if(e.key===\"Enter\"&&(e.ctrlKey||e.metaKey)){e.preventDefault();addPlaca();}});\n$(\"sedesList\").addEventListener(\"click\",e=>{\n  const b=e.target.closest(\"button[data-delp]\"); if(!b)return;\n  const p=placas.find(x=>x.id===b.dataset.delp); if(!p)return;\n  confirmBox(`¿Eliminar la placa ${p.placa} de ${p.sede}? Los registros históricos de esta placa se conservan.`,async()=>{\n    try{await db.collection(\"placas\").doc(p.id).delete();pMsg(`Placa ${p.placa} eliminada.`,\"ok\");}catch{pMsg(\"No se pudo eliminar la placa.\",\"err\");}\n  });\n});\n\n$(\"tb\").addEventListener(\"click\",e=>{\n  const b=e.target.closest(\"button\"); if(!b)return;\n  if(b.dataset.ed) startEdit(b.dataset.ed);\n  if(b.dataset.del){const r=rows.find(x=>x.id===b.dataset.del); if(!r)return;\n    const viejo=Date.now()-(r.createdAt||0)>SEIS_H;\n    confirmBox(viejo?`¿Borrar el registro de ${r.placa}? Tiene más de 6 horas: se quita de la tabla pero queda guardado en el histórico Excel/CSV.`:\"¿Bor
