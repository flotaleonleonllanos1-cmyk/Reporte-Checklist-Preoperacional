<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--card:#13201f;--line:#28403e;--ink:#eefaf8;--mut:#9bb5b1;--acc:#d4a017;--ok:#1ed9b0;--bad:#f07070}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#1c3b3d,#0a1414 70%) fixed;color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 18px}
header>div:first-child small{letter-spacing:.3em;color:#13e0c4;font-weight:800}#usr{display:flex;align-items:center;gap:6px}header h1{margin:2px 0 0;font-size:1.35rem}
main{max-width:1200px;margin:0 auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
input,select,button{font:inherit}input,select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0b1514;color:var(--ink)}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#f2c94c,#d4a017 55%,#b8860b);color:#111}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}
.login{max-width:380px;margin:60px auto}.login label{display:grid;gap:4px;font-weight:700;margin-top:10px}.login .btn{width:100%;margin-top:14px}
.err{color:var(--bad);font-weight:700;min-height:1.2em;margin-top:8px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:1.6rem;color:var(--acc)}.kpi span{color:var(--mut);font-size:.8rem}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.tw{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}
th{color:var(--mut);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--card)}
tr.r{cursor:pointer}tr.r:hover{background:rgba(19,224,196,.07)}tr.nuevo{animation:nv 2.5s ease}@keyframes nv{0%{background:rgba(242,201,76,.35)}100%{background:none}}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:800}.p-ok{background:rgba(30,217,176,.18);color:var(--ok)}.p-no{background:rgba(240,112,112,.18);color:var(--bad)}.p-cr{background:rgba(212,160,23,.2);color:#f2c94c}
.p-s{background:rgba(94,200,242,.18);color:#7fd3f5}.p-r{background:rgba(155,225,93,.18);color:#b8ec84}
dialog{max-width:820px;width:94vw;background:#0f1a19;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.db{padding:12px 16px;max-height:70vh;overflow:auto}.qi{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.qi .n{color:var(--mut);font-weight:800}.qi .o{grid-column:2/-1;color:#ffd2d2;font-size:.84rem}.cat{color:var(--acc);font-weight:900;font-size:.72rem}
.mail .mh{display:grid;gap:2px;margin-bottom:8px}.mail .mh small{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:rgba(19,224,196,.12);border:1px solid rgba(19,224,196,.4);font-size:.84rem}
.chips button{border:0;background:rgba(240,112,112,.25);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:.7rem;line-height:1}
.msgc{color:#f2c94c;font-weight:700;margin-top:6px;min-height:1em}.btn:disabled{opacity:.5;cursor:not-allowed}
.opb{display:inline-flex;gap:4px;align-items:center;border:0;border-radius:999px;padding:2px 8px;font:inherit;font-size:.68rem;cursor:pointer;margin:1px 0}.opb.p-s{background:rgba(94,200,242,.18);color:#7fd3f5}.opb.p-r{background:rgba(155,225,93,.18);color:#b8ec84}.opb.p-ok{background:rgba(30,217,176,.18);color:var(--ok)}.opb.vac{background:rgba(240,112,112,.12);color:var(--bad);cursor:default}.opb:not(.vac):hover{filter:brightness(1.25)}
.mini th,.mini td{padding:4px 6px!important;font-size:.72rem!important}.mini .pill{font-size:.65rem;padding:1px 7px}.mini .bar{width:44px;height:6px}table.mini{min-width:760px}
.alerta{margin-top:12px;border:1px solid var(--bad);background:rgba(240,112,112,.13);color:#ffd2d2;border-radius:12px;padding:10px 14px;font-size:.9rem}
.mh{display:grid;gap:2px;margin-bottom:6px}.mh small{color:var(--mut)}table.sr{min-width:700px}tr.mal td{background:rgba(240,112,112,.07)}
.bar{display:inline-block;width:70px;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;vertical-align:middle;margin-right:8px}.bar i{display:block;height:100%}
.empty{color:var(--mut);text-align:center;padding:24px}.live{font-size:.78rem;color:#13e0c4}.live::before{content:"● ";animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3}}
</style></head><body>
<header><div><small>LLANOS</small><h1>Reportes · Checklist preoperacional</h1></div><div id="usr"></div></header>
<main id="app"></main>
<dialog id="det"></dialog>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDYsewqqh0a0m46vRRN_bP3F6NBYGldyTE",authDomain:"checklist-583f9.firebaseapp.com",projectId:"checklist-583f9",storageBucket:"checklist-583f9.firebasestorage.app",messagingSenderId:"906852823631",appId:"1:906852823631:web:0727d6d9405f2d5be3703a",measurementId:"G-CCPMV617JB"};
const fa=initializeApp(firebaseConfig),db=getFirestore(fa),auth=getAuth(fa);
const Q=[['DOC','¿Cuenta con documentación vigente, física o digital?',1],['SEG','¿El cinturón de seguridad se encuentra operativo?',1],['SEG','¿La alarma de reversa funciona correctamente?',1],
 ['SEG','¿La caja fuerte se encuentra disponible y en buen estado?',1],['SEG','¿El botón de pánico se encuentra disponible en el vehículo?',1],['MEC','¿Los frenos de servicio operan correctamente?',1],
 ['MEC','¿El freno de mano opera correctamente?',1],['MEC','¿La dirección se encuentra sin anomalías?',1],['MEC','¿El tablero y los indicadores funcionan correctamente?',0],
 ['LUZ','¿Las luces de freno funcionan correctamente?',1],['LUZ','¿El sistema de iluminación funciona correctamente?',0],['VIS','¿Los espejos se encuentran en buen estado?',1],
 ['VIS','¿Los limpiaparabrisas funcionan correctamente?',0],['VIS','¿El parabrisas se encuentra libre de daños críticos?',0],
 ['EQU','¿El vehículo cuenta con botiquín y se ha validado con Seguridad que se encuentre completo y con artículos vigentes?',0],
 ['TEC','¿El vehículo cuenta con cámara de reversa y funciona correctamente en la posición adecuada?',0],['TEC','¿El vehículo cuenta con Dashcam y funciona correctamente?',0],
 ['ORD','¿La unidad se encuentra limpia y ordenada?',0],['SEG','¿El claxon funciona correctamente?',0],['MEC','¿El vehículo se encuentra sin fugas de líquidos debajo del camión?',1],
 ['MEC','¿El vehículo se encuentra sin fugas de aire?',1],['SEG','¿Extintor vigente y disponible?',1],['LLA','¿Presión correcta en todas las llantas?',1],
 ['LLA','¿Llantas con dibujo/milimetraje aceptable?',1],['LLA','¿Llantas en buen estado sin daños o golpes visibles?',1],['LLA','¿Pernos o tuercas de Llanta completas y en buen estado?',1],
 ['CAR','¿La Carrocería se encuentra en buen estado y funcional?',0],['EQU','¿Conos/reflejantes completos?',1],['EQU','¿Tacos o bloqueadores de rueda disponibles?',1],
 ['ETI','¿Cuenta con todas las etiquetas de seguridad y señalización completas y visibles?',0],['CARRET','¿Carretillas o diablos se encuentran completos?',0],['CARRET','¿Carretillas o diablos se encuentran funcionales?',0]];
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let PL={Villavicencio:[],Yopal:[]},plSede='Villavicencio',msgP='',D=[],vistos=null,F={sede:'',oper:'',mes:'',estado:'',q:''},unsub=null,correos=[],urlExcel='',msgC='',Vact=[];
const fd=f=>{const[a,b]=String(f||'').split(' ');if(!a)return'—';const[y,m,d]=a.split('-');return `${d}/${m}/${y} ${(b||'').slice(0,5)}`};
function login(msg=''){$('usr').innerHTML='';$('app').innerHTML=`<div class="card login"><h2 style="margin:0">Ingresar</h2><p style="color:var(--mut);margin:6px 0 0">Para revisar los reportes del checklist.</p>
  <form id="lf"><label>Correo<input id="em" type="email" required autocomplete="username"></label><label>Contraseña<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit">Ingresar</button><div class="err" id="le">${esc(msg)}</div></form></div>`;
  $('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(x){$('le').textContent=x.code==='auth/invalid-credential'||x.code==='auth/wrong-password'?'Correo o contraseña incorrectos.':x.code==='auth/operation-not-allowed'?'Activa «Correo y contraseña» en Firebase Authentication.':'No se pudo ingresar ('+x.code+').'}}}
onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}if(!u){login();return}
  $('usr').innerHTML=`<span class="live">En vivo</span> <small style="color:var(--mut);margin:0 8px">${esc(u.email)}</small><button class="btn g" id="out">Salir</button>`;$('out').onclick=()=>signOut(auth);
  $('app').innerHTML='<p class="empty">Cargando reportes…</p>';
  ['Villavicencio','Yopal'].forEach(s=>onSnapshot(doc(db,'config','placas_'+s),d=>{PL[s]=d.exists()?(d.data().placas||[]):[];if(vistos)pintar()},()=>{}));
  unsub=onSnapshot(query(collection(db,'checklists'),orderBy('creado','desc'),limit(2000)),snap=>{const nuevos=vistos?snap.docs.filter(d=>!vistos.has(d.id)).map(d=>d.id):[];
    vistos=new Set(snap.docs.map(d=>d.id));D=snap.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));pintar(nuevos)},
    x=>{$('app').innerHTML=`<p class="empty">No se pudieron leer los reportes (${esc(x.code)}). Revisa las reglas de Firestore.</p>`})});
// Salida y retorno: cada placa que hace Salida en un día debe hacer también Retorno ese día (100 %); si falta una, queda en 50 %
function pares(L){const m={};L.filter(x=>x.operacion).forEach(x=>{const dia=String(x.fecha||'').slice(0,10),k=dia+'|'+x.sede+'|'+x.placa;const e=m[k]=m[k]||{dia,sede:x.sede,placa:x.placa,sal:0,ret:0,cond:new Set()};
  if(x.operacion==='Salida')e.sal++;else if(x.operacion==='Retorno')e.ret++;e.cond.add(x.conductor)});
  return Object.values(m).map(e=>({...e,pct:e.sal&&e.ret?100:50,falta:e.sal&&!e.ret?'Retorno':!e.sal&&e.ret?'Salida':''})).sort((a,b)=>b.dia.localeCompare(a.dia)||a.placa.localeCompare(b.placa))}
function pintar(nuevos=[]){
  const meses=[...new Set(D.map(x=>String(x.fecha||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const q=F.q.trim().toLowerCase(),V=D.filter(x=>(!F.sede||x.sede===F.sede)&&(!F.oper||x.operacion===F.oper)&&(!F.mes||String(x.fecha||'').startsWith(F.mes))
    &&(!F.estado||(F.estado==='no'?x.totalNo>0:F.estado==='cr'?(x.criticosNo||[]).length>0:x.totalNo===0))&&(!q||`${x.placa} ${x.conductor}`.toLowerCase().includes(q)));
  const base=D.filter(x=>(!F.sede||x.sede===F.sede)&&(!F.mes||String(x.fecha||'').startsWith(F.mes))&&(!q||`${x.placa} ${x.conductor}`.toLowerCase().includes(q))),P=pares(base),PM={};P.forEach(e=>PM[e.dia+'|'+e.sede+'|'+e.placa]=e);
  const GM={},G=[];V.forEach(x=>{const dia=String(x.fecha||'').slice(0,10);if(!x.operacion){G.push({dia,sede:x.sede,placa:x.placa,sinOp:x,ord:x.fecha});return}
    const k=dia+'|'+x.sede+'|'+x.placa;let g=GM[k];if(!g){g=GM[k]={dia,sede:x.sede,placa:x.placa,sal:null,ret:null,ord:''};G.push(g)}
    if(x.operacion==='Salida'){if(!g.sal||x.fecha>g.sal.fecha)g.sal=x}else if(x.operacion==='Retorno'){if(!g.ret||x.fecha>g.ret.fecha)g.ret=x}if(x.fecha>g.ord)g.ord=x.fecha});
  G.forEach(g=>{if(g.sinOp)return;const e=PM[g.dia+'|'+g.sede+'|'+g.placa]||{pct:g.sal&&g.ret?100:50,falta:g.sal&&!g.ret?'Retorno':!g.sal?'Salida':''};g.pct=e.pct;g.falta=e.falta});
  G.sort((a,b)=>String(b.ord).localeCompare(String(a.ord)));
  const conNo=V.filter(x=>x.totalNo>0).length,cr=V.filter(x=>(x.criticosNo||[]).length).length,hoy=new Date().toISOString().slice(0,10);
  const NOs=[];V.forEach(x=>{const R=x.respuestas||{};Q.forEach(([c,qq,cr],i)=>{const r=R['q'+String(i+1).padStart(2,'0')]||{};if(r.r==='NO')NOs.push({x,n:i+1,c,q:qq,cr,obs:r.obs||''})});if(x.obsGeneral)NOs.push({x,n:'',c:'OBS',q:'Observaciones generales',cr:0,obs:x.obsGeneral})});
  $('app').innerHTML=`<div class="card"><div class="mh"><b>Placas del formulario</b><small>Las placas que guardes aquí aparecen automáticamente en el formulario para la sede elegida.</small></div>
    <div class="fil"><label>Sede<select id="pls">${['Villavicencio','Yopal'].map(s=>`<option${s===plSede?' selected':''}>${s}</option>`).join('')}</select></label>
    <input id="pln" placeholder="Placa, ej: TRK494" maxlength="8" style="text-transform:uppercase;width:160px"><button class="btn" id="plg">Guardar</button><small style="color:var(--mut)">${PL[plSede].length} placa${PL[plSede].length===1?'':'s'} en ${plSede}</small></div>
    <div class="chips">${PL[plSede].map((p,i)=>`<span>${esc(p)}<button data-pd="${i}" title="Eliminar ${esc(p)}">✕</button></span>`).join('')||'<small style="color:var(--mut)">Aún no hay placas para esta sede.</small>'}</div><div class="msgc">${esc(msgP)}</div></div>
  <div class="card"><div class="fil">
    <label>Sede<select id="fs"><option value="">Todas</option>${['Villavicencio','Yopal'].map(s=>`<option${s===F.sede?' selected':''}>${s}</option>`).join('')}</select></label>
    <label>Operación<select id="fo"><option value="">Todas</option>${['Salida','Retorno'].map(s=>`<option${s===F.oper?' selected':''}>${s}</option>`).join('')}</select></label>
    <label>Mes<select id="fm"><option value="">Todos</option>${meses.map(k=>`<option value="${k}"${k===F.mes?' selected':''}>${MES[+k.slice(5)-1]} ${k.slice(0,4)}</option>`).join('')}</select></label>
    <label>Estado<select id="fe"><option value="">Todos</option><option value="ok"${F.estado==='ok'?' selected':''}>Sin NO</option><option value="no"${F.estado==='no'?' selected':''}>Con NO</option><option value="cr"${F.estado==='cr'?' selected':''}>Con críticos en NO</option></select></label>
    <input id="fq" type="search" placeholder="Buscar placa o conductor…" value="${esc(F.q)}" style="flex:1;min-width:180px">
    <button class="btn" id="xls" title="Descarga un Excel por cada mes">⬇ Excel por mes</button></div></div>
   <div class="kpis"><div class="kpi"><b>${V.length}</b><span>Checklists</span></div><div class="kpi"><b>${V.filter(x=>String(x.fecha).startsWith(hoy)).length}</b><span>Enviados hoy</span></div>
    <div class="kpi ok"><b>${V.length-conNo}</b><span>Sin ningún NO</span></div><div class="kpi bad"><b>${conNo}</b><span>Con algún NO</span></div><div class="kpi bad"><b>${cr}</b><span>Con ítems críticos en NO</span></div></div>
   <div class="card"><div class="mh"><b>Reportes</b><small>Cumplimiento salida y retorno: <b style="color:${P.length&&P.every(e=>e.pct===100)?'var(--ok)':'var(--bad)'}">${P.length?Math.round(P.filter(e=>e.pct===100).length/P.length*100):0}%</b> · cada placa debe hacer Salida y Retorno el mismo día</small></div>
   <div class="tw"><table class="mini"><thead><tr><th>Fecha</th><th>Sede</th><th>Placa</th><th>Operación</th><th>Conductor(es)</th><th>Km</th><th>Resultado</th><th>Críticos</th><th>Cumplimiento salida y retorno</th></tr></thead><tbody>
   ${G.map(g=>{const S=g.sal,Rt=g.ret,op=(x,l,cl)=>x?`<button class="opb ${cl}" data-id="${x.id}" title="Ver checklist de ${l}"><b>${l}</b> ${fd(x.fecha).slice(11)}</button>`:`<span class="opb vac">${l} —</span>`;
     const L=[S,Rt].filter(Boolean),no=L.reduce((a,x)=>a+(x.totalNo||0),0),cr=L.reduce((a,x)=>a+((x.criticosNo||[]).length),0),c=g.pct===100?'var(--ok)':'var(--bad)';
     return `<tr class="${L.some(x=>nuevos.includes(x.id))?'nuevo':''}"><td>${fd(g.dia).slice(0,10)}</td><td>${esc(g.sede)}</td><td><b>${esc(g.placa)}</b></td>
      <td>${g.sinOp?op(g.sinOp,'Checklist','p-ok'):op(S,'Salida','p-s')+' '+op(Rt,'Retorno','p-r')}</td><td>${esc([...new Set(L.concat(g.sinOp?[g.sinOp]:[]).map(x=>x.conductor))].join(' / '))}</td>
      <td>${S||Rt?`${esc(S?S.km||'—':'—')} → ${esc(Rt?Rt.km||'—':'—')}`:esc(g.sinOp.km||'—')}</td>
      <td>${g.sinOp?(g.sinOp.totalNo?`<span class="pill p-no">${g.sinOp.totalNo} NO</span>`:'<span class="pill p-ok">Todo SI</span>'):no?`<span class="pill p-no">${no} NO</span>`:'<span class="pill p-ok">Todo SI</span>'}</td>
      <td>${(g.sinOp?(g.sinOp.criticosNo||[]).length:cr)?`<span class="pill p-cr">⚠ ${g.sinOp?(g.sinOp.criticosNo||[]).length:cr}</span>`:''}</td>
      <td>${g.sinOp?'<span style="color:var(--mut)">—</span>':`<div class="bar"><i style="width:${g.pct}%;background:${c}"></i></div><b style="color:${c}">${g.pct}%${g.falta?' · falta '+g.falta:''}</b>`}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No hay reportes con estos filtros.</td></tr>'}</tbody></table></div></div>
   <div class="card"><div class="mh"><b>NO y observaciones por placa</b><small>${NOs.length} registro${NOs.length===1?'':'s'} · fecha y hora en que se diligenció el formulario</small></div>
    <div class="tw" style="max-height:420px"><table class="mini"><thead><tr><th>Fecha y hora</th><th>Sede</th><th>Placa</th><th>Operación</th><th>Conductor</th><th>Pregunta en NO</th><th>Observación</th></tr></thead><tbody>
    ${NOs.map(o=>`<tr><td>${fd(o.x.fecha)}</td><td>${esc(o.x.sede)}</td><td><b>${esc(o.x.placa)}</b></td><td>${o.x.operacion?`<span class="pill ${o.x.operacion==='Salida'?'p-s':'p-r'}">${esc(o.x.operacion)}</span>`:'—'}</td><td>${esc(o.x.conductor)}</td>
      <td>${o.n?`<span class="cat">${o.cr?'⚠ ':''}${o.c}</span> ${o.n}. ${esc(o.q)}`:'<b>Observaciones generales</b>'}</td><td class="ob">${esc(o.obs)||'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No hay NO ni observaciones con estos filtros.</td></tr>'}</tbody></table></div></div>`;
  $('fs').onchange=e=>{F.sede=e.target.value;pintar()};$('fo').onchange=e=>{F.oper=e.target.value;pintar()};$('fm').onchange=e=>{F.mes=e.target.value;pintar()};$('fe').onchange=e=>{F.estado=e.target.value;pintar()};
  $('fq').oninput=e=>{F.q=e.target.value;clearTimeout(window.__t);window.__t=setTimeout(()=>{pintar();const i=$('fq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
  document.querySelectorAll('.opb[data-id]').forEach(b=>b.onclick=()=>detalle(D.find(x=>x.id===b.dataset.id)));
  $('xls').onclick=()=>excel(V);
  $('pls').onchange=e=>{plSede=e.target.value;msgP='';pintar()};
  const gP=async l=>setDoc(doc(db,'config','placas_'+plSede),{placas:l});
  $('plg').onclick=async()=>{const v=$('pln').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length<5){msgP='Escribe una placa válida (ej: TRK494).';return pintar()}
    if(PL[plSede].includes(v)){msgP=`${v} ya está en ${plSede}.`;return pintar()}try{await gP([...PL[plSede],v].sort());msgP=`✔ ${v} guardada en ${plSede}.`}catch(x){msgP='No se pudo guardar ('+x.code+').'}pintar();setTimeout(()=>{const i=$('pln');if(i)i.focus()},50)};
  $('pln').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('plg').click()}};
  document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=async()=>{const v=PL[plSede][+b.dataset.pd];if(!confirm(`¿Eliminar la placa ${v} de ${plSede}?`))return;try{await gP(PL[plSede].filter(x=>x!==v));msgP=`Placa ${v} eliminada.`}catch(x){msgP='No se pudo eliminar ('+x.code+').'}pintar()});Vact=V;
}
function detalle(x){if(!x)return;const R=x.respuestas||{},d=$('det');
  d.innerHTML=`<div class="dh"><div><b style="font-size:1.15rem">${esc(x.placa)}</b> · ${esc(x.conductor)}<br><small style="color:var(--mut)">${fd(x.fecha)} · ${esc(x.sede)} · ${esc(x.operacion||'—')} · Km ${esc(x.km||'—')}</small></div><button class="btn g" id="dc">✕ Cerrar</button></div>
   <div class="db"><p style="margin:0 0 8px">${x.totalSi||0} SI · <b style="color:var(--bad)">${x.totalNo||0} NO</b> · Aceptación: ${x.aceptacion?'Sí':'No'}</p>
   ${Q.map(([c,q,cr],i)=>{const r=R['q'+String(i+1).padStart(2,'0')]||{};return `<div class="qi"><span class="n">${i+1}.</span><span><span class="cat">${cr?'⚠ ':''}${c}</span> ${esc(q)}</span><span class="pill ${r.r==='NO'?'p-no':'p-ok'}">${esc(r.r||'—')}</span>${r.r==='NO'?`<span class="o">Observación: ${esc(r.obs||'')}</span>`:''}</div>`}).join('')}
   ${x.obsGeneral?`<p style="margin-top:12px"><b>Observaciones:</b> ${esc(x.obsGeneral)}</p>`:''}</div>`;
  d.showModal();$('dc').onclick=()=>d.close()}
async function libroXLSX(V){if(!window.XLSX){await new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=er;document.head.appendChild(s)})}
  const PP={};pares(D).forEach(e=>PP[e.dia+'|'+e.sede+'|'+e.placa]=e);
  const enc=['Fecha','Sede','Operación','Placa','Conductor','Kilometraje','Total SI','Total NO','Críticos en NO','Salida y retorno (día)'];Q.forEach(([c,q],i)=>{enc.push(`${i+1}. ${c} - ${q}`);enc.push(`Obs. ${i+1}`)});enc.push('Observaciones generales');
  const rows=[enc,...V.map(x=>{const R=x.respuestas||{},e=PP[String(x.fecha||'').slice(0,10)+'|'+x.sede+'|'+x.placa],f=[x.fecha,x.sede,x.operacion||'',x.placa,x.conductor,x.km||'',x.totalSi,x.totalNo,(x.criticosNo||[]).join(' | '),e?(e.pct===100?'100% completo':'50% · falta '+e.falta):''];Q.forEach((q,i)=>{const r=R['q'+String(i+1).padStart(2,'0')]||{};f.push(r.r||'');f.push(r.obs||'')});f.push(x.obsGeneral||'');return f})];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Checklist');return wb}
const nombreX=()=>`checklist_preoperacional_${new Date().toISOString().slice(0,10)}.xlsx`;
async function excel(V){if(!V.length)return alert('No hay reportes para descargar con estos filtros.');
  const meses=[...new Set(V.map(x=>String(x.fecha||'').slice(0,7)).filter(Boolean))].sort();
  for(const mm of meses){const Vm=V.filter(x=>String(x.fecha||'').startsWith(mm)),wb=await libroXLSX(Vm),Pm=pares(D.filter(x=>String(x.fecha||'').startsWith(mm)&&(!F.sede||x.sede===F.sede)));
    const sr=[['Día','Sede','Placa','Conductor(es)','Salida','Retorno','Cumplimiento %','Estado'],...Pm.map(e=>[e.dia,e.sede,e.placa,[...e.cond].join(', '),e.sal?'SI':'NO',e.ret?'SI':'NO',e.pct,e.pct===100?'Completo':'ALERTA: falta '+e.falta])];
    const ws=XLSX.utils.aoa_to_sheet(sr);ws['!cols']=[{wch:12},{wch:14},{wch:10},{wch:28},{wch:8},{wch:8},{wch:14},{wch:24}];XLSX.utils.book_append_sheet(wb,ws,'Salida y retorno');
    const al=Pm.filter(e=>e.pct<100);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['ALERTAS · Placas sin Salida y Retorno el mismo día'],['Día','Sede','Placa','Falta'],...al.map(e=>[e.dia,e.sede,e.placa,e.falta])]),'Alertas');
    XLSX.writeFile(wb,`checklist_preoperacional_${mm}${F.sede?'_'+F.sede:''}.xlsx`);await new Promise(r=>setTimeout(r,500))}}
