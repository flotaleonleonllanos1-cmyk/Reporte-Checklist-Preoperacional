  for(const mm of meses){const Vm=V.filter(x=>String(x.fecha||'').startsWith(mm)),wb=await libroXLSX(Vm),Pm=pares(D.filter(x=>String(x.fecha||'').startsWith(mm)&&(!F.sede||x.sede===F.sede)));
    const sr=[['DÍA','SEDE','PLACA','CONDUCTOR(ES)','SALIDA','RETORNO','CUMPLIMIENTO %','ESTADO'],...Pm.slice().sort((a,b)=>a.dia.localeCompare(b.dia)||a.placa.localeCompare(b.placa)).map(e=>[e.dia,e.sede.toUpperCase(),e.placa.toUpperCase(),[...e.cond].map(c=>String(c).toUpperCase()).join(' / '),e.sal?'SI':'NO',e.ret?'SI':'NO',e.pct,e.pct===100?'COMPLETO':'ALERTA: FALTA '+e.falta.toUpperCase()])];
    // placas programadas (MOVILIZADORES) que no hicieron checklist en el día: 0 %
    Object.values(PROG).filter(pg=>String(pg.dia).startsWith(mm)&&(!F.sede||pg.sede===F.sede)).forEach(pg=>(pg.placas||[]).forEach(pl=>{if(!Pm.some(e=>e.dia===pg.dia&&e.sede===pg.sede&&e.placa===pl))sr.push([pg.dia,pg.sede.toUpperCase(),pl,'','NO','NO',0,'ALERTA: PROGRAMADA SIN CHECKLIST'])}));
    sr.splice(1,sr.length-1,...sr.slice(1).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||String(a[2]).localeCompare(String(b[2]))));
    const ws=XLSX.utils.aoa_to_sheet(sr);ws['!cols']=[{wch:12},{wch:14},{wch:10},{wch:28},{wch:8},{wch:8},{wch:14},{wch:24}];XLSX.utils.book_append_sheet(wb,ws,'Salida y retorno');
    const al=Pm.filter(e=>e.pct<100);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['ALERTAS · PLACAS SIN SALIDA Y RETORNO EL MISMO DÍA'],['DÍA','SEDE','PLACA','FALTA'],...al.map(e=>[e.dia,e.sede.toUpperCase(),e.placa.toUpperCase(),e.falta.toUpperCase()])]),'Alertas');
    XLSX.writeFile(wb,`checklist_preoperacional_${mm}${F.sede?'_'+F.sede:''}.xlsx`);await new Promise(r=>setTimeout(r,500))}}
